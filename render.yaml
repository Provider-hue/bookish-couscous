# Render blueprint for the rndf backend (single file: server.py).
#
# Render dashboard -> New -> Blueprint -> pick this repo and set the YAML path to
# `render.yaml`. sahu65 is installed from PyPI (already published), so the
# build needs nothing from the rest of the repo.
#
# No `rootDir` is set on purpose: server.py, public/ and api/ all live at the
# repository root, and Vercel's vercel.json resolves `public` relative to that
# same root. Pointing `rootDir` at a subdirectory would break both deploys.
services:
  - type: web
    name: rndf-api
    runtime: python
    plan: free # ~512 MB RAM vs ~480 MB steady-state for the model; use `starter` if you OOM
    buildCommand: pip install sahu65==1.1.0
    startCommand: python server.py
    healthCheckPath: /healthz # liveness only; gate clients on GET /readyz instead
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: HOST
        value: 0.0.0.0
      # Render injects $PORT itself; server.py binds to it automatically.
      - key: LOG_LEVEL
        value: info
      - key: MAX_UPLOAD_MB
        value: "10"
      # Tighten to https://<your-app>.vercel.app once the frontend domain is known.
      - key: ALLOWED_ORIGINS
        value: "*"
      # Auto-generated gate for POST /detect. Copy this value into Vercel's
      # DEMO_API_KEY env var so public/script.js can present it.
      - key: API_KEY
        generateValue: true
      # --- Groq narrator (server.py) ------------------------------------------
      # Leave GROQ_API_KEY unset and scans still return: the explanation falls back
      # to a factual template and `intent` comes back null.
      - key: GROQ_API_KEY
        sync: false
      # Swap models without a code change, e.g. llama-3.1-8b-instant for a cheaper
      # narration pass. See https://console.groq.com/docs/models for current ids.
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Narrator instructions. Set this as a multi-line value in the Render
      # dashboard (Environment -> your service -> Add). Left unset, server.py uses
      # its built-in default, which you can also override locally in .env.
      - key: SYSTEM_PROMPT
        sync: false
