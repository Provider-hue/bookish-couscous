<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Detection Meter (L to R)</title>
    <style>
        /* Base page styling */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a1a1a; 
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* Container for the meter */
        .meter-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
        }

        /* SVG Styling */
        svg {
            width: 100%;
            overflow: visible;
        }

        /* The empty background track of the arc */
        .arc-track {
            fill: none;
            stroke: #333;
            stroke-width: 40;
            stroke-linecap: butt;
        }

        /* The active filling arc */
        .arc-fill {
            fill: none;
            stroke-width: 40;
            stroke-linecap: butt;
            /* The dasharray defines the total length of the line */
            stroke-dasharray: 251.3; 
            /* The dashoffset determines how much is hidden (251.3 = 0%, 0 = 100%) */
            stroke-dashoffset: 251.3;
            /* Smooth transition when the score changes */
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
            
            /* Add a subtle glow effect */
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        /* Score Display */
        .score-display {
            margin-top: 15px;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .label-text {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Demo Controls */
        .controls {
            margin-top: 40px;
            text-align: center;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        input[type="range"] {
            width: 200px;
            cursor: pointer;
            accent-color: #fff;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="meter-wrapper">
        <!-- 
            SVG coordinate system: 0 0 to 200 120.
            The arc is a 180-degree semi-circle.
            Radius (r) = 80.
            Circumference of a full circle = 2 * PI * r = 502.6.
            Length of a semi-circle (our arc) = 502.6 / 2 = 251.3.
        -->
        <svg viewBox="0 0 200 120">
            <!-- Empty Track -->
            <path class="arc-track" d="M 20 100 A 80 80 0 0 1 180 100" />
            
            <!-- Filling Track (Now starts at LEFT 20 100, sweeps to RIGHT 180 100) -->
            <path id="arcFill" class="arc-fill" d="M 20 100 A 80 80 0 0 1 180 100" />
        </svg>

        <!-- Score Below the arc -->
        <div id="scoreText" class="score-display">0</div>
        <div class="label-text">Detection Level</div>
    </div>

    <!-- Controls to demonstrate the UI logic -->
    <div class="controls">
        <label for="scoreSlider">Manual Control: </label><br>
        <input type="range" id="scoreSlider" min="0" max="100" value="0">
        <br>
        <button id="autoBtn">Run Auto-Scan</button>
    </div>

    <script>
        // DOM Elements
        const arcFill = document.getElementById('arcFill');
        const scoreText = document.getElementById('scoreText');
        const scoreSlider = document.getElementById('scoreSlider');
        const autoBtn = document.getElementById('autoBtn');

        // The total length of the arc path
        const MAX_DASH = 251.3;

        /**
         * Interpolates between two RGB colors based on a percentage (0 to 1)
         */
        function lerpColor(color1, color2, amount) {
            const r = Math.round(color1[0] + (color2[0] - color1[0]) * amount);
            const g = Math.round(color1[1] + (color2[1] - color1[1]) * amount);
            const b = Math.round(color1[2] + (color2[2] - color1[2]) * amount);
            return `rgb(${r}, ${g}, ${b})`;
        }

        /**
         * Updates the UI based on a score from 0 to 100
         */
        function updateMeter(score) {
            // 1. Update the number text
            scoreText.innerText = score;

            // 2. Calculate the dash offset (0 = empty, 251.3 = full)
            const offset = MAX_DASH - (MAX_DASH * (score / 100));
            arcFill.style.strokeDashoffset = offset;

            // 3. Calculate RGB Color Gradient
            // 0% = Green [46, 204, 113]
            // 50% = Yellow/Orange [241, 196, 15]
            // 100% = Red [231, 76, 60]
            let currentColor;
            if (score <= 50) {
                // Interpolate between Green and Yellow
                currentColor = lerpColor([46, 204, 113], [241, 196, 15], score / 50);
            } else {
                // Interpolate between Yellow and Red
                currentColor = lerpColor([241, 196, 15], [231, 76, 60], (score - 50) / 50);
            }

            // Apply the calculated color to the SVG stroke and the Score text
            arcFill.style.stroke = currentColor;
            scoreText.style.color = currentColor;
            scoreText.style.textShadow = `0 0 15px ${currentColor}66`; 
        }

        // --- Event Listeners for the Demo ---

        // 1. Slider Control
        scoreSlider.addEventListener('input', (e) => {
            updateMeter(parseInt(e.target.value));
        });

        // 2. Auto-Scan Animation
        let scanInterval = null;
        let isScanning = false;

        autoBtn.addEventListener('click', () => {
            if (isScanning) {
                clearInterval(scanInterval);
                autoBtn.innerText = "Run Auto-Scan";
                isScanning = false;
                return;
            }

            isScanning = true;
            autoBtn.innerText = "Stop Scan";
            let currentScore = 0;
            let direction = 1; // 1 for up, -1 for down

            scanInterval = setInterval(() => {
                currentScore += direction * 2; 

                if (currentScore >= 100) {
                    currentScore = 100;
                    direction = -1;
                } else if (currentScore <= 0) {
                    currentScore = 0;
                    direction = 1;
                }

                scoreSlider.value = currentScore;
                updateMeter(currentScore);

            }, 30); 
        });

        // Initialize at 0
        updateMeter(0);
    </script>
</body>
</html>
